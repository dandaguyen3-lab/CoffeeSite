<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login · Kopi Ko</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="loginpage">
    <script src="pricing.js"></script>
    <script src="script.js"></script>
    <div>
    <h1 class="login">Welcome back</h1>
<form class="loginform" onsubmit="login(); return false;">
    <label for="username" class="namelabel"><b>Username</b></label>
    <input type="text" class="name" id="userinput" name="username" placeholder="Enter username" autocomplete="username" required>
    <label for="password" class="pwlabel"><b>Password</b></label>
    <input type="password" class="pw" placeholder="Enter password" id="passwordinput" name="password" autocomplete="current-password" required>
    <button class="button" type="submit">Login</button>
    <a class="linkcreate" href="createaccount.html">New here? Create an account</a>
</form>
<p class="wrong" id="result" role="alert"></p>
    </div>
</body>
</html>
