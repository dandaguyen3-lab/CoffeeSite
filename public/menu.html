</div>

<script>enableSmartNavbarScroll();
toggleMenu();
document.addEventListener('DOMContentLoaded', () => {
  const coffeeIds = [
    'coffee1-menu',
    'coffee2-menu',
    'coffee3-menu',
    'coffee4-menu',
    'coffee5-menu',
    'coffee6-menu'
  ];

  coffeeIds.forEach(id => {
    const element = document.getElementById(id);
    const isHidden = localStorage.getItem(id) === 'hidden';

    if (element) {
      element.style.display = isHidden ? 'none' : '';
    }
  });
});


</script>
</body>
</html>
